<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物画像プロンプトメーカー</title>
<style>
    /* 全体のデザイン設定 */
    :root {
        --primary-color: #4A90E2;
        --bg-color: #F4F7F9;
        --card-bg: #FFFFFF;
        --text-color: #333333;
        --border-color: #E1E8ED;
    }

    body { 
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 15px; 
        margin: 0;
        display: flex;
        justify-content: center;
        font-size: 14px; /* 全体のベース文字サイズをやや小さめに */
    }

    .container {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
    }

    h2 { 
        text-align: center;
        color: var(--primary-color);
        margin-top: 0;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--bg-color);
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .version {
        font-size: 12px;
        font-weight: normal;
        color: #888;
        background: #f0f4f8;
        padding: 2px 8px;
        border-radius: 12px;
    }

    /* 入力欄のレイアウト */
    .form-group { 
        display: flex; 
        align-items: flex-start;
        margin-bottom: 12px; 
        padding-bottom: 12px;
        border-bottom: 1px dashed var(--border-color);
        min-height: 38px;
    }
    
    .form-group:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }

    label.section-label { 
        flex: 0 0 160px; /* ラベルの幅を少し縮小 */
        font-weight: 600; 
        font-size: 14px;
        color: #555;
        padding-top: 8px;
    }

    .input-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
    }
    
    .input-wrapper.row-layout {
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
    }

    /* 各種入力フォームのデザイン統一 */
    input[type="text"], input[type="number"], select, .form-group textarea { 
        width: 100%; 
        padding: 8px 12px; 
        box-sizing: border-box; 
        border: 1px solid #CCD6DD; 
        border-radius: 6px; 
        font-size: 14px;
        background-color: #fff;
        font-family: inherit;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 70px;
    }

    /* 自由入力欄 */
    .custom-input {
        margin-top: 6px;
        display: none;
        background-color: #FAFCFD;
    }
    .custom-input.always-show {
        display: block;
    }

    /* チェックボックスグループ（複数選択用） */
    .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 6px;
    }
    .checkbox-group label {
        flex: none;
        width: auto;
        font-weight: normal;
        padding: 4px 10px;
        color: #333;
        background: #f0f4f8;
        border: 1px solid #CCD6DD;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .checkbox-group label:hover {
        background: #e1e8ed;
    }
    .checkbox-group input[type="checkbox"] {
        margin-right: 4px;
    }

    input[type="number"] {
        max-width: 120px;
    }
    .unit {
        color: #777;
        font-size: 14px;
    }

    details { 
        margin-top: 20px; 
        padding: 15px; 
        background: #FAFCFD; 
        border: 1px solid var(--border-color);
        border-radius: 8px; 
    }
    summary { 
        font-weight: bold; 
        font-size: 14px;
        cursor: pointer; 
        color: var(--primary-color);
        outline: none;
    }

    .btn-generate { 
        display: block; 
        width: 100%; 
        padding: 14px; 
        background: var(--primary-color); 
        color: #fff; 
        border: none; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        margin-top: 25px; 
        transition: background 0.3s;
    }
    .btn-generate:hover { background: #357ABD; }

    .output-area { 
        margin-top: 30px; 
        background: var(--bg-color);
        padding: 20px;
        border-radius: 8px;
    }
    .output-area label {
        display: block;
        margin-bottom: 8px;
        color: var(--primary-color);
        font-size: 16px;
        font-weight: bold;
    }
    #resultPrompt { 
        width: 100%; 
        height: 300px; 
        padding: 12px; 
        box-sizing: border-box; 
        border: 1px solid var(--border-color); 
        border-radius: 6px; 
        resize: vertical; 
        font-size: 14px;
        line-height: 1.5;
        background-color: #fff;
    }
    
    .btn-copy { 
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px; 
        background: #2ECA7F; 
        color: #fff; 
        border: none; 
        border-radius: 6px; 
        font-size: 14px; 
        font-weight: bold;
        cursor: pointer; 
        margin-top: 12px; 
        transition: background 0.3s;
    }
    .btn-copy:hover { background: #25A566; }

    /* スマートフォン表示の最適化 */
    @media (max-width: 600px) {
        .container { padding: 15px; }
        .form-group { flex-direction: column; align-items: stretch; margin-bottom: 10px; padding-bottom: 10px;}
        label.section-label { margin-bottom: 4px; padding-top: 0; flex: none; width: 100%; font-size: 13px;}
        input[type="number"] { max-width: 100%; }
        .input-wrapper.row-layout { flex-direction: column; align-items: stretch; gap: 6px; }
        h2 { font-size: 18px; }
        .btn-generate { padding: 12px; font-size: 15px;}
    }
</style>
</head>
<body>

<div class="container">
    <h2>人物画像プロンプトメーカー <span class="version">v1.2</span></h2>

    <form id="promptForm">
        <!-- メイン入力欄 -->
        <div class="form-group">
            <label class="section-label">画像サイズ</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="9:16 (縦長)">9:16 (スマホ向け・縦長)</option>
                    <option value="3:4 (縦長)">3:4 (縦長)</option>
                    <option value="1:1 (正方形)">1:1 (アイコン向け・正方形)</option>
                    <option value="16:9 (横長)">16:9 (PC向け・横長)</option>
                    <option value="4:3 (横長)">4:3 (横長)</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="例: 横1024×縦1536">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">国籍</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="日本">日本</option>
                    <option value="韓国">韓国</option>
                    <option value="中国">中国</option>
                    <option value="台湾">台湾</option>
                    <option value="アメリカ">アメリカ</option>
                    <option value="イギリス">イギリス</option>
                    <option value="フランス">フランス</option>
                    <option value="ドイツ">ドイツ</option>
                    <option value="イタリア">イタリア</option>
                    <option value="ロシア">ロシア</option>
                    <option value="オランダ">オランダ</option>
                    <option value="カナダ">カナダ</option>
                    <option value="カンボジア">カンボジア</option>
                    <option value="ブラジル">ブラジル</option>
                    <option value="アフリカ">アフリカ</option>
                    <option value="多国籍・ハーフ">多国籍・ハーフ</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に国籍を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">性別</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="女性">女性</option>
                    <option value="男性">男性</option>
                    <option value="中性的">中性的</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に性別を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">年齢</label>
            <div class="input-wrapper">
                <!-- JavaScriptで5〜80歳まで自動生成 -->
                <select id="age-select" onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に年齢を入力（例: 20代前半）">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">髪型</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="ストレート">ストレート</option>
                    <option value="ボブ">ボブ</option>
                    <option value="ポニーテール">ポニーテール</option>
                    <option value="ツインテール">ツインテール</option>
                    <option value="ハーフツインテール">ハーフツインテール</option>
                    <option value="お団子ヘア">お団子ヘア</option>
                    <option value="巻き髪">巻き髪</option>
                    <option value="ショートヘア">ショートヘア</option>
                    <option value="マッシュルーム">マッシュルーム</option>
                    <option value="センターパート">センターパート</option>
                    <option value="custom">自由入力</option>
                </select>
                <div class="checkbox-group" style="margin-top: 8px;">
                    <label><input type="checkbox" value="前髪あり">前髪あり</label>
                    <label><input type="checkbox" value="前髪なし">前髪なし</label>
                </div>
                <input type="text" class="custom-input" placeholder="自由に髪型を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">髪の長さ</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="ベリーショート">ベリーショート</option>
                    <option value="ショート">ショート</option>
                    <option value="ミディアム">ミディアム（肩くらい）</option>
                    <option value="セミロング">セミロング（胸くらい）</option>
                    <option value="ロング">ロング</option>
                    <option value="スーパーロング">スーパーロング</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に長さを入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">髪色</label>
            <div class="input-wrapper">
                <div class="row-layout">
                    <select class="tone-select" style="flex:1;">
                        <option value="">明るさ指定なし</option>
                        <option value="明るめの">明るめの</option>
                        <option value="暗めの">暗めの</option>
                    </select>
                    <select class="item-select" style="flex:2;" onchange="toggleCustomInput(this)">
                        <option value="">色を選択</option>
                        <option value="黒髪">黒髪</option>
                        <option value="茶髪（ブラウン）">茶髪（ブラウン）</option>
                        <option value="金髪（ブロンド）">金髪（ブロンド）</option>
                        <option value="ミルクティーベージュ">ミルクティーベージュ</option>
                        <option value="グレージュ">グレージュ</option>
                        <option value="アッシュグレー">アッシュグレー</option>
                        <option value="オリーブグレージュ">オリーブグレージュ</option>
                        <option value="ピンクブラウン">ピンクブラウン</option>
                        <option value="ブルーブラック">ブルーブラック</option>
                        <option value="ラベンダーアッシュ">ラベンダーアッシュ</option>
                        <option value="赤髪">赤髪</option>
                        <option value="ピンク髪">ピンク髪</option>
                        <option value="水色髪">水色髪</option>
                        <option value="銀髪（シルバー）">銀髪（シルバー）</option>
                        <option value="白髪">白髪</option>
                        <option value="インナーカラー">インナーカラー（内側だけ染める）</option>
                        <option value="ハイライト">ハイライト（スジ盛り）</option>
                        <option value="グラデーションカラー">グラデーションカラー</option>
                        <option value="custom">自由入力</option>
                    </select>
                </div>
                <input type="text" class="custom-input" placeholder="自由に髪色を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">目線</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="カメラ目線（カメラを向いている）">カメラ目線（カメラを向いている）</option>
                    <option value="カメラを外している（よそ見をしている）">カメラを外している（よそ見をしている）</option>
                    <option value="横顔（横を向いている）">横顔（横を向いている）</option>
                    <option value="伏し目がち（下を見ている）">伏し目がち（下を見ている）</option>
                    <option value="目を閉じている">目を閉じている</option>
                    <option value="見上げている">見上げている</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に目線を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">表情</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="笑顔">笑顔</option>
                    <option value="歯が見えるほどの笑顔">歯が見えるほどの笑顔</option>
                    <option value="微笑んでいる">微笑んでいる</option>
                    <option value="照れている">照れている</option>
                    <option value="真顔・無表情">真顔・無表情</option>
                    <option value="ウインクしている">ウインクしている</option>
                    <option value="驚いている">驚いている</option>
                    <option value="困っている">困っている</option>
                    <option value="怒っている">怒っている</option>
                    <option value="悲しんでいる">悲しんでいる</option>
                    <option value="ドヤ顔・得意げ">ドヤ顔・得意げ</option>
                    <option value="舌を出している">舌を出している</option>
                    <option value="口を尖らせている">口を尖らせている</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に表情を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">顔・パーツの特徴</label>
            <div class="input-wrapper">
                <div class="checkbox-group">
                    <label><input type="checkbox" value="一般的">一般的</label>
                    <label><input type="checkbox" value="整った顔立ち">整った顔立ち</label>
                    <label><input type="checkbox" value="大きな目">大きな目</label>
                    <label><input type="checkbox" value="目が小さい">目が小さい</label>
                    <label><input type="checkbox" value="切れ長の目">切れ長の目</label>
                    <label><input type="checkbox" value="垂れ目">垂れ目</label>
                    <label><input type="checkbox" value="目力が有る">目力が有る</label>
                    <label><input type="checkbox" value="丸顔">丸顔</label>
                    <label><input type="checkbox" value="シャープな輪郭">シャープな輪郭</label>
                    <label><input type="checkbox" value="そばかす">そばかす</label>
                    <label><input type="checkbox" value="泣きぼくろ">泣きぼくろ</label>
                    <label><input type="checkbox" value="ほくろが多い">ほくろが多い</label>
                    <label><input type="checkbox" value="ほくろが印象的">ほくろが印象的</label>
                    <label><input type="checkbox" value="鼻が大きい">鼻が大きい</label>
                    <label><input type="checkbox" value="鼻が高い">鼻が高い</label>
                    <label><input type="checkbox" value="鼻筋がキレイ">鼻筋がキレイ</label>
                    <label><input type="checkbox" value="口が大きい">口が大きい</label>
                    <label><input type="checkbox" value="口が小さい">口が小さい</label>
                    <label><input type="checkbox" value="童顔">童顔</label>
                    <label><input type="checkbox" value="大人っぽい顔">大人っぽい顔</label>
                </div>
                <input type="text" class="custom-input always-show" placeholder="その他の特徴を自由に追記（複数可）">
            </div>
        </div>
        
        <div class="form-group">
            <label class="section-label">身長</label>
            <div class="input-wrapper">
                <!-- JavaScriptで100〜200cmまで自動生成 -->
                <select id="height-select" onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に身長を入力（例: 160cm台）">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">体型の特徴</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="標準体型">標準体型</option>
                    <option value="スレンダー・痩せ型">スレンダー・痩せ型</option>
                    <option value="ややふくよか">ややふくよか</option>
                    <option value="ぽっちゃり">ぽっちゃり</option>
                    <option value="筋肉質・アスリート">筋肉質・アスリート</option>
                    <option value="グラマー">グラマー</option>
                    <option value="華奢">華奢</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に体型を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">頭身</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="1頭身">1頭身</option>
                    <option value="2頭身">2頭身</option>
                    <option value="3頭身">3頭身</option>
                    <option value="4頭身">4頭身</option>
                    <option value="5頭身">5頭身</option>
                    <option value="6頭身">6頭身</option>
                    <option value="7頭身">7頭身</option>
                    <option value="8頭身">8頭身</option>
                    <option value="9頭身">9頭身</option>
                    <option value="10頭身">10頭身</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に頭身を入力（例: 8頭身）">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">職業</label>
            <div class="input-wrapper">
                <select onchange="toggleCustomInput(this)">
                    <option value="">未選択</option>
                    <option value="学生">学生</option>
                    <option value="会社員・OL">会社員・OL</option>
                    <option value="秘書">秘書</option>
                    <option value="CA">CA</option>
                    <option value="看護師">看護師</option>
                    <option value="美容部員">美容部員</option>
                    <option value="エステティシャン">エステティシャン</option>
                    <option value="アパレル店員">アパレル店員</option>
                    <option value="カフェ店員">カフェ店員</option>
                    <option value="キャバ嬢">キャバ嬢</option>
                    <option value="ガールズバー店員">ガールズバー店員</option>
                    <option value="グラビアアイドル">グラビアアイドル</option>
                    <option value="インフルエンサー">インフルエンサー</option>
                    <option value="警察官">警察官</option>
                    <option value="教師">教師</option>
                    <option value="custom">自由入力</option>
                </select>
                <input type="text" class="custom-input" placeholder="自由に職業を入力">
            </div>
        </div>

        <div class="form-group">
            <label class="section-label">ルックスの雰囲気</label>
            <div class="input-wrapper">
                <div class="checkbox-group">
                    <label><input type="checkbox" value="かわいい・キュート">かわいい・キュート</label>
                    <label><input type="checkbox" value="美しい・綺麗">美しい・綺麗</label>
                    <label><input type="checkbox" value="クール・かっこいい">クール・かっこいい</label>
                    <label><input type="checkbox" value="清楚">清楚</label>
                    <label><input type="checkbox" value="控えめ">控えめ</label>
                    <label><input type="checkbox" value="セクシー">セクシー</label>
                    <label><input type="checkbox" value="ボーイッシュ">ボーイッシュ</label>
                    <label><input type="checkbox" value="元気・活発">元気・活発</label>
                    <label><input type="checkbox" value="アイドル">アイドル</label>
                    <label><input type="checkbox" value="ギャル">ギャル</label>
                    <label><input type="checkbox" value="田舎のギャル">田舎のギャル</label>
                    <label><input type="checkbox" value="派手なギャル">派手なギャル</label>
                    <label><input type="checkbox" value="地雷系">地雷系</label>
                    <label><input type="checkbox" value="量産型">量産型</label>
                    <label><input type="checkbox" value="垢抜けない">垢抜けない</label>

<script>
    // ページ読み込み時に時代設定(1990-2026)、年齢(5-80)、身長(100-200)を自動生成
    document.addEventListener("DOMContentLoaded", function() {
        const eraSelect = document.getElementById('era-select');
        const eraCustomOption = eraSelect.querySelector('option[value="custom"]');
        for (let year = 1990; year <= 2026; year++) {
            const opt = document.createElement('option');
            opt.value = year + '年';
            opt.textContent = year + '年';
            eraSelect.insertBefore(opt, eraCustomOption);
        }

        const ageSelect = document.getElementById('age-select');
        const ageCustomOption = ageSelect.querySelector('option[value="custom"]');
        for (let i = 5; i <= 80; i++) {
            const opt = document.createElement('option');
            opt.value = i + '歳';
            opt.textContent = i + '歳';
            ageSelect.insertBefore(opt, ageCustomOption);
        }

        const heightSelect = document.getElementById('height-select');
        const heightCustomOption = heightSelect.querySelector('option[value="custom"]');
        for (let i = 100; i <= 200; i++) {
            const opt = document.createElement('option');
            opt.value = i + 'cm';
            opt.textContent = i + 'cm';
            heightSelect.insertBefore(opt, heightCustomOption);
        }
    });

    function toggleCustomInput(selectElem) {
        const wrapper = selectElem.closest('.input-wrapper');
        const customInput = wrapper.querySelector('.custom-input');
        if(customInput) {
            if (selectElem.value === 'custom') {
                customInput.style.display = 'block';
                customInput.focus(); 
            } else {
                customInput.style.display = 'none';
            }
        }
    }

    function generatePrompt() {
        const formGroups = document.querySelectorAll('.form-group');
        const prompts = [];

        formGroups.forEach(group => {
            const label = group.querySelector('.section-label').innerText;
            let val = '';

            const checkboxes = group.querySelectorAll('input[type="checkbox"]:checked');
            const colorSelect = group.querySelector('.color-select');
            const toneSelect = group.querySelector('.tone-select'); 
            const itemSelect = group.querySelector('.item-select');
            const standardSelect = group.querySelector('select:not(.color-select):not(.tone-select):not(.item-select)');
            const customInput = group.querySelector('.custom-input');
            const textarea = group.querySelector('textarea');
            const simpleTextInput = group.querySelector('input[type="text"]:not(.custom-input)');

            // パターン1: チェックボックスメイン
            if (group.querySelector('.checkbox-group') && !standardSelect) {
                let valArray = [];
                checkboxes.forEach(cb => valArray.push(cb.value));
                if (customInput && customInput.value.trim()) {
                    valArray.push(customInput.value.trim());
                }
                val = valArray.join('、');
            } 
            // パターン2: 色＋アイテム（服装・履物）
            else if (colorSelect && itemSelect) {
                let itemVal = '';
                if (itemSelect.value === 'custom') {
                    itemVal = customInput ? customInput.value.trim() : '';
                } else if (itemSelect.value !== '') {
                    itemVal = itemSelect.value.split('（')[0];
                }
                
                if (itemVal) {
                    val = (colorSelect.value ? colorSelect.value + 'の' : '') + itemVal;
                }
            }
            // パターン3: トーン＋アイテム（髪色）
            else if (toneSelect && itemSelect) {
                let itemVal = '';
                if (itemSelect.value === 'custom') {
                    itemVal = customInput ? customInput.value.trim() : '';
                } else if (itemSelect.value !== '') {
                    itemVal = itemSelect.value.split('（')[0];
                }
                
                if (itemVal) {
                    val = (toneSelect.value ? toneSelect.value : '') + itemVal;
                }
            }
            // パターン4: 通常のプルダウン
            else if (standardSelect) {
                let valArray = [];
                if (standardSelect.value === 'custom') {
                    if (customInput && customInput.value.trim()) {
                        valArray.push(customInput.value.trim());
                    }
                } else if (standardSelect.value !== '') {
                    valArray.push(standardSelect.value.split('（')[0]);
                }
                
                checkboxes.forEach(cb => {
                    valArray.push(cb.value);
                });
                
                val = valArray.join('、');
            } 
            // パターン5: テキストエリア
            else if (textarea) {
                val = textarea.value.trim();
            }
            // パターン6: 単純なテキストボックス
            else if (simpleTextInput) {
                val = simpleTextInput.value.trim();
            }

            if (val) {
                prompts.push(`${label}：${val}`);
            }
        });

        let finalOutput = "";
        if (prompts.length > 0) {
            // 出力文言の変更
            finalOutput = "以下の設定で画像を作成。\n\n" + prompts.join('\n');
        }
        
        document.getElementById('resultPrompt').value = finalOutput;
    }

    function copyToClipboard() {
        const textarea = document.getElementById('resultPrompt');
        if (!textarea.value) {
            alert('コピーするプロンプトがありません。');
            return;
        }
        
        textarea.select();
        document.execCommand('copy');
        
        const copyBtn = document.querySelector('.btn-copy');
        const originalText = copyBtn.innerText;
        copyBtn.innerText = 'コピー完了！';
        copyBtn.style.background = '#218838';
        
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.background = '#2ECA7F';
        }, 2000);
    }
</script>
